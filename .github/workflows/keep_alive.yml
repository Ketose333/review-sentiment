name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright 설치
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Streamlit 앱 깨우기 및 로딩 확인
        env:
          STREAMLIT_APP_URL: https://nsmc-sentiment.streamlit.app
        run: node .github/scripts/keep_streamlit_awake.mjs
